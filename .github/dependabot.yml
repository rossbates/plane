version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: selfhost-v1.4.2
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    target-branch: selfhost-v1.4.2
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /apps/api
    target-branch: selfhost-v1.4.2
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /apps/live
      - /apps/admin
      - /apps/space
      - /apps/proxy
    target-branch: selfhost-v1.4.2
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
