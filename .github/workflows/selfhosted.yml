name: Self-hosted platform
on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to build and publish (browser = frontend, admin, space)
        type: choice
        default: frontend
        options: [frontend, backend, live, admin, space, proxy, browser, all]
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deployments/selfhosted/**'
      - 'docs/selfhosted/**'
      - '.github/**'
      - '.gitleaks.toml'
      - '.dockerignore'
      - '.gitignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deployments/selfhosted/**'
      - 'docs/selfhosted/**'
      - '.github/**'
      - '.gitleaks.toml'
      - '.dockerignore'
      - '.gitignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
permissions:
  contents: read
concurrency:
  group: selfhosted-${{ github.ref }}-${{ inputs.component || 'policy' }}
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check public/private deployment boundary
        run: python3 deployments/selfhosted/check-policy.py
      - name: Scan fork history for secrets (redacted)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner
          --log-opts='5f7d92784c403f76284f0f16718f320221dc7fec..HEAD'
      - name: Validate generic Compose (dummy values only)
        env:
          APP_DOMAIN: plane.example.com
          WEB_URL: https://plane.example.com
          POSTGRES_PASSWORD: compose-validation-only
          RABBITMQ_PASSWORD: compose-validation-only
          SECRET_KEY: compose-validation-only
          LIVE_SERVER_SECRET_KEY: compose-validation-only
          AWS_ACCESS_KEY_ID: compose-validation-only
          AWS_SECRET_ACCESS_KEY: compose-validation-only
          PLANE_IMAGE_OWNER: example
          PLANE_IMAGE_TAG: sha-${{ github.sha }}
        run: docker compose -f deployments/selfhosted/compose.example.yml config --quiet

  select:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/selfhost-v1.4.2'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.components.outputs.matrix }}
    steps:
      - id: components
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          python3 - <<'PY'
          import json, os
          recipes = {
              'backend': ('apps/api', 'apps/api/Dockerfile.api'),
              'live': ('.', 'apps/live/Dockerfile.live'),
              'frontend': ('.', 'apps/web/Dockerfile.web'),
              'admin': ('.', 'apps/admin/Dockerfile.admin'),
              'space': ('.', 'apps/space/Dockerfile.space'),
              'proxy': ('apps/proxy', 'apps/proxy/Dockerfile.ce'),
          }
          requested = os.environ['COMPONENT']
          selected = list(recipes) if requested == 'all' else (
              ['frontend', 'admin', 'space'] if requested == 'browser' else [requested]
          )
          matrix = {'include': [dict(component=c, context=recipes[c][0], dockerfile=recipes[c][1]) for c in selected]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix) + '\n')
          PY

  publish:
    name: Publish ${{ matrix.component }}
    needs: [policy, select]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/selfhost-v1.4.2'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GHCR with the workflow token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish selected component
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: mode=min
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plane-${{ matrix.component }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/plane-${{ matrix.component }}:selfhost-v1.4.2
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=source-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=source-${{ matrix.component }}
      - name: Record published image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/plane-${{ matrix.component }}
          SHA: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### %s\n\n- Tag: `sha-%s`\n- Digest: `%s`\n' "$IMAGE" "$SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
