name: Fork Pages API
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/api/**'
      - 'apps/live/src/extensions/redis.ts'
      - 'deployments/pages-api/**'
      - '.github/workflows/pages-api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/live/src/extensions/redis.ts'
      - 'deployments/pages-api/**'
      - '.github/workflows/pages-api.yml'
permissions:
  contents: read
concurrency:
  group: pages-api-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pages API contract tests (isolated Postgres and Redis)
        run: docker compose -p plane-pages-api-tests -f deployments/pages-api/compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
      - name: Lint and format fork Python files
        run: |
          docker compose -p plane-pages-api-tests -f deployments/pages-api/compose.test.yml run --rm --no-deps tests ruff check plane/api/serializers/page.py plane/api/views/page.py plane/api/urls/page.py plane/utils/page_document_lock.py plane/tests/contract/api/test_pages.py
          docker compose -p plane-pages-api-tests -f deployments/pages-api/compose.test.yml run --rm --no-deps tests ruff format --check plane/api/serializers/page.py plane/api/views/page.py plane/api/urls/page.py plane/utils/page_document_lock.py plane/tests/contract/api/test_pages.py
      - name: Build and test Live coordination hook
        run: |
          docker build -f deployments/pages-api/Dockerfile.live -t plane-live-pages-api:test .
          docker run --rm --entrypoint node -v "$PWD/deployments/pages-api/live-coordination.test.mjs:/tmp/live-coordination.test.mjs:ro" plane-live-pages-api:test --test /tmp/live-coordination.test.mjs
      - name: Remove disposable test stack
        if: always()
        run: docker compose -p plane-pages-api-tests -f deployments/pages-api/compose.test.yml down -v

  publish:
    name: Publish ${{ matrix.component }}
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/selfhost-v1.4.2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: deployments/pages-api/Dockerfile
          - component: live
            context: .
            dockerfile: deployments/pages-api/Dockerfile.live
          - component: frontend
            context: deployments/pages-api/frontend
            dockerfile: deployments/pages-api/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR with the workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version-pinned and branch images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plane-${{ matrix.component }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/plane-${{ matrix.component }}:selfhost-v1.4.2
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=plane-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=plane-${{ matrix.component }}
      - name: Record published image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/plane-${{ matrix.component }}
          SHA: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### %s\n\n- Tag: `sha-%s`\n- Digest: `%s`\n' "$IMAGE" "$SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
